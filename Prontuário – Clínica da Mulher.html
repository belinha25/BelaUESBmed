<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prontuário – Clínica da Mulher</title>
<style>
:root{--bg:#FDF0F4;--card:#fff;--ink:#3A1F2B;--mut:#8A6676;--line:#F0C9D8;--acc:#D6336C;--acc2:#C2185B;--warn:#FFF4E0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1420;--card:#3A1C2B;--ink:#FBE6EE;--mut:#D8A9BE;--line:#5A2E43;--acc:#F48FB1;--acc2:#A8305F;--warn:#3A2F18}}
:root[data-theme="dark"]{--bg:#2A1420;--card:#3A1C2B;--ink:#FBE6EE;--mut:#D8A9BE;--line:#5A2E43;--acc:#F48FB1;--acc2:#A8305F;--warn:#3A2F18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,Arial,sans-serif}
header{background:linear-gradient(135deg,#C2185B,#F06292);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:17px;margin:0 8px 0 0;font-weight:700}
#chip{font-size:13px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;border-radius:8px;padding:8px 12px;font:600 13px Inter,Arial,sans-serif;background:#fff;color:var(--acc2);cursor:pointer}
.btn.p{background:#FFC2D9;color:#7A1240}.btn.d{background:#C0553E;color:#fff}.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
nav{display:flex;gap:4px;padding:8px 10px 0;background:var(--bg);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--mut);padding:9px 14px;font:600 14px Inter,Arial,sans-serif;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{padding:12px}
.panel{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel input.q{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line)}
.it b{cursor:pointer}.it small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#8E1B4C;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.on{opacity:1}
.warn{background:var(--warn);border:1px solid #E0A33A;border-radius:10px;padding:8px 12px;margin:0 auto 10px;max-width:760px;font-size:13px}
.cola{max-width:794px;margin:0 auto 10px;background:var(--card);border:1px dashed var(--acc);border-radius:10px;padding:10px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cola b{margin-right:4px}
.wrap{overflow-x:auto;padding-bottom:10px}
.sheet{display:none;background:#fff;color:#000;width:794px;margin:0 auto 14px;padding:10mm 11mm;font:8.6pt/1.25 Arial,Helvetica,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.sheet.on{display:block}
.sheet h2{font-size:11pt;text-align:center;text-decoration:underline;margin:0 0 6px;display:flex;justify-content:center;align-items:center;gap:8px}
.sheet h2 img{height:11mm}
.r{display:flex;border-bottom:1px solid #000;min-height:5.2mm;align-items:flex-end;gap:2mm}
.c{display:flex;align-items:flex-end;gap:1mm;min-width:0}
.c label,.f label{white-space:nowrap}
.sheet input[type=text],.sheet textarea{border:0;background:transparent;font:inherit;color:#000;width:100%;min-width:0;padding:0;outline:0;border-radius:0}
.sheet input[type=text]:focus,.sheet textarea:focus{background:#FFF0F5}
.sheet input[type=checkbox]{width:3mm;height:3mm;margin:0 .5mm;accent-color:#000;flex:none}
.sec{font-weight:700;text-decoration:underline;background:#C8C8C8;padding:0 1mm;white-space:nowrap}
.ck{display:flex;gap:2.5mm;align-items:center;flex-wrap:wrap}.ck label{display:flex;align-items:center;gap:.5mm}
.sheet textarea{resize:none;overflow:hidden;line-height:5.2mm;min-height:calc(var(--r,1)*5.2mm);display:block;background-image:repeating-linear-gradient(transparent 0,transparent calc(5.2mm - 1px),#000 calc(5.2mm - 1px),#000 5.2mm)}
.nb{border:0;background:#D6336C;color:#fff;font:700 9px Arial;border-radius:3px;padding:0 3px;margin-left:3px;cursor:pointer;vertical-align:middle}
.f{margin:0}.f label{font-weight:400}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.g2>div{padding:0 3mm}.g2>div:first-child{border-right:1px solid #000}
.t{font-weight:700;text-decoration:underline;margin:2mm 0 1mm;display:block}
.im{display:block;margin:0 auto 2mm;border:1px solid #000;padding:1mm;max-height:30mm}
.box{border:1px solid #000;padding:1.5mm 2mm;margin-top:4mm}
.pg{border:1px solid #000;padding:2mm}
table.lab{width:100%;border-collapse:collapse;table-layout:fixed}
table.lab td,table.lab th{border:1px solid #000;padding:0 1mm;height:5.6mm;font-size:8pt}
table.lab td:first-child{width:17%;font-weight:700}
table.lab input{font-size:8pt}
table.cp{width:100%;border-collapse:collapse;table-layout:fixed}
table.cp td{border:1px solid #000;vertical-align:top;padding:1mm 1.5mm;width:50%}
table.cp .c{margin:.8mm 0;flex-wrap:wrap}
.pn{font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.modal.on{display:flex}.modal .panel{width:100%;max-width:640px}
.modal textarea{width:100%;height:220px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (max-width:820px){.sheet{width:794px}}
@page{size:A4;margin:8mm}
@media print{
 body{background:#fff}header,nav,.cola,.warn,#toast,.nb,.modal,#tab-pac{display:none!important}
 main{padding:0}.wrap{overflow:visible;padding:0}
 .sheet{display:none;width:auto;margin:0;padding:0;box-shadow:none;break-before:page;page-break-before:always}#tab-f1 .sheet{break-before:auto;page-break-before:auto}body.all .wrap[hidden]{display:block!important}
 .sheet.on{display:block}
 body.all .sheet{display:block}
 .sheet input[type=text]:focus,.sheet textarea:focus{background:transparent}
}
</style></head><body>
<header><h1>Prontuário · Clínica da Mulher</h1><span id="chip">Nova ficha</span>
<button class="btn p" id="bSave">Salvar</button><button class="btn" id="bNew">Nova paciente</button>
<button class="btn" id="bPrint">Imprimir aba</button><button class="btn" id="bPrintAll">Imprimir tudo</button><button class="btn" id="bBk">Backup</button></header>
<nav id="nav"><button data-t="pac" class="on">Pacientes</button><button data-t="f1">Ficha I</button><button data-t="f2">Ficha II</button><button data-t="ex">Exames</button></nav>
<main>
<div id="warn" class="warn" style="display:none">Este navegador não permite salvar. Os dados valem só enquanto esta página estiver aberta: use Backup.</div>
<section id="tab-pac"><div class="panel"><input class="q" id="q" type="search" placeholder="Buscar paciente pelo nome" autocomplete="off"><div id="list"></div></div></section>
<div id="tab-f1" class="wrap" hidden></div><div id="tab-f2" class="wrap" hidden></div><div id="tab-ex" class="wrap" hidden></div>
</main>
<div id="toast"></div>
<div class="modal" id="bk"><div class="panel"><h3 style="margin:0 0 6px">Backup das fichas</h3><p style="font-size:13px;color:var(--mut);margin:0 0 8px">Copie o texto e guarde em local seguro (notas, e-mail para você). Para restaurar, cole aqui e toque em Restaurar.</p><textarea id="bkt"></textarea><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn p" id="bkGen">Gerar backup</button><button class="btn s" id="bkCopy">Copiar</button><button class="btn s" id="bkRes">Restaurar</button><button class="btn s" id="bkX">Fechar</button></div></div></div>

/* abas */
var TAB="pac";
function show(t){TAB=t;$$("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});$("#tab-pac").hidden=t!=="pac";["f1","f2","ex"].forEach(function(x){$("#tab-"+x).hidden=t!==x});
 $$(".sheet").forEach(function(s){s.classList.toggle("on",s.dataset.s===t)});if(t==="pac")renderList();grow()}

/* dados */
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2200)}
function load(){try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){store={};mem=true;$("#warn").style.display="block"}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){mem=true;$("#warn").style.display="block"}}
function collect(){var v={};$$("[data-k]").forEach(function(el){if(el.type==="checkbox"){if(el.checked)v[el.dataset.k]=1}else if(el.value)v[el.dataset.k]=el.value});return v}
function fill(v){$$("[data-k]").forEach(function(el){var x=v[el.dataset.k];if(el.type==="checkbox")el.checked=!!x;else el.value=x||""});grow();mirror()}
function mirror(){var n=($('[data-k="nome"]').value||"").trim();$$(".pn").forEach(function(s){s.textContent=n});$("#chip").textContent=n||"Nova ficha"}
function grow(){$$(".sheet textarea").forEach(function(t){t.style.height="auto";if(t.scrollHeight>t.clientHeight+2)t.style.height=t.scrollHeight+"px"})}
function today(){var d=new Date();return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear()}
function save(silent){var v=collect();var n=(v.nome||"").trim();if(!n){if(!silent)toast("Preencha o nome da paciente na Ficha I");return false}
 if(!cur)cur="p"+Date.now();store[cur]={id:cur,nome:n,upd:Date.now(),v:v};persist();if(!silent)toast("Ficha salva");return true}
var tm;document.addEventListener("input",function(e){var el=e.target;if(!el.dataset||!el.dataset.k)return;
 if(el.tagName==="TEXTAREA")grow();if(el.dataset.k==="nome")mirror();
 if(el.dataset.k==="peso"||el.dataset.k==="alt"){var p=parseFloat($('[data-k="peso"]').value.replace(",",".")),a=parseFloat($('[data-k="alt"]').value.replace(",","."));if(p>0&&a>0){if(a>3)a=a/100;$('[data-k="imc"]').value=(p/(a*a)).toFixed(1).replace(".",",")}}
 clearTimeout(tm);tm=setTimeout(function(){save(true)},700)});

 if(b.dataset.g&&b.closest(".cola")){var ks=b.dataset.g==="*"?[].concat.apply([],Object.keys(GRP).map(function(g){return GRP[g]})):GRP[b.dataset.g];ks.forEach(normal);grow();save(true);toast("Normais inseridos nos campos vazios")}});
/* lista */
function norm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function renderList(){var q=norm($("#q").value),ids=Object.keys(store).filter(function(i){return norm(store[i].nome).indexOf(q)>-1}).sort(function(a,b){return norm(store[a].nome)<norm(store[b].nome)?-1:1});
 $("#list").innerHTML=ids.length?ids.map(function(i){var p=store[i],d=new Date(p.upd).toLocaleDateString("pt-BR");return '<div class="it"><div data-open="'+i+'"><b data-open="'+i+'">'+p.nome.replace(/</g,"&lt;")+'</b><br><small>'+(p.v.dn?'Nasc. '+p.v.dn.replace(/</g,"&lt;")+' · ':'')+'atualizada em '+d+'</small></div><button class="btn s" data-del="'+i+'">Excluir</button></div>'}).join(""):'<p style="color:var(--mut)">'+(Object.keys(store).length?'Nenhuma paciente com esse nome.':'Nenhuma ficha salva ainda. Toque em Nova paciente.')+'</p>'}
$("#q").oninput=renderList;
$("#list").onclick=function(e){var o=e.target.dataset.open,d=e.target.dataset.del;
 if(o){cur=o;fill(store[o].v);show("f1");window.scrollTo(0,0)}
 if(d){if(e.target.dataset.arm){delete store[d];if(cur===d)cur=null;persist();renderList();toast("Ficha excluída")}else{e.target.dataset.arm=1;e.target.textContent="Confirmar?";e.target.className="btn d"}}};
$("#bSave").onclick=function(){save(false)};

$("#bBk").onclick=function(){$("#bkt").value="";$("#bk").classList.add("on")};$("#bkX").onclick=function(){$("#bk").classList.remove("on")};
